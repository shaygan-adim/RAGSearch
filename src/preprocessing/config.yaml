paths:
  raw_data_dir: "../../data/raw"
  processed_data_dir: "../../data/preprocessed"

text_construction:
  # Query Construction Toggles
  query:
    append_category: false         # If True: "Query Text" + "Category Name"
    separator: " "                # Character used to join parts

  # Product Construction Toggles
  product:
    include_brand: true           # If True: Append Brand Name
    include_category: false        # If True: Append Category Name
    # Note: Structure will be: Product Name + [Category] + [Brand]
    separator: " "

cleaning:
  min_query_length: 2             # Drop queries shorter than this (post-cleaning)
  hazm_normalize: true            # Main toggle for Hazm normalization